workflows:
  ios-unsigned:
    name: Build iOS Unsigned IPA
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      flutter: 3.47.4
      xcode: latest
      python: 3.12
    scripts:
      - name: Set up Go
        script: |
          brew install go || true
      - name: Build iOS IPA
        script: |
          python3 scripts/build_ios.py --all-sources
    artifacts:
      - dist/ios/*.ipa
      - dist/ios/*.zip
